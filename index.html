<script>
const frames=[...document.querySelectorAll(".section-frame")],resizeJobs=new WeakMap(),previousHeights=new WeakMap(),frameObservers=new WeakMap(),navigationReady=new WeakSet();

const anchorAliases={
"#home":"#home",
"#work":"#work",
"#projects":"#work",
"#capabilities":"#capabilities",
"#skills":"#capabilities",
"#ai-engineering":"#ai-engineering",
"#ai":"#ai-engineering",
"#more-work":"#more-work",
"#experience":"#more-work",
"#project-archive":"#project-archive",
"#archive":"#project-archive",
"#contact":"#contact"
};

function frameDocument(frame){try{return frame.contentDocument||frame.contentWindow?.document||null}catch{return null}}

function measureFrame(frame){const doc=frameDocument(frame);if(!doc)return 0;const body=doc.body,html=doc.documentElement;return Math.ceil(Math.max(body?.scrollHeight||0,body?.offsetHeight||0,html?.scrollHeight||0,html?.offsetHeight||0))}

function resizeFrame(frame){const oldJob=resizeJobs.get(frame);if(oldJob)cancelAnimationFrame(oldJob);const job=requestAnimationFrame(()=>{const height=measureFrame(frame);if(!height)return;const previous=previousHeights.get(frame)||0;if(Math.abs(height-previous)<=2)return;frame.style.height=`${height}px`;frame.style.minHeight="0";previousHeights.set(frame,height)});resizeJobs.set(frame,job)}

function resolveTarget(hash){if(!hash||hash==="#")return null;const resolved=anchorAliases[hash]||hash;try{return document.querySelector(resolved)}catch{return null}}

function navigateTo(hash,updateHistory=true){const target=resolveTarget(hash);if(!target)return false;target.scrollIntoView({behavior:window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});if(updateHistory)history.replaceState(null,"",hash);return true}

function setupInternalNavigation(frame){if(navigationReady.has(frame))return;const doc=frameDocument(frame);if(!doc)return;doc.addEventListener("click",event=>{const link=event.target.closest?.('a[href^="#"]');if(!link)return;const hash=link.getAttribute("href");if(!hash||hash==="#")return;if(!resolveTarget(hash))return;event.preventDefault();navigateTo(hash,true)});navigationReady.add(frame)}

function observeFrame(frame){const oldObserver=frameObservers.get(frame);if(oldObserver)oldObserver.disconnect();const doc=frameDocument(frame);if(!doc||typeof ResizeObserver==="undefined")return;let scheduled=false;const observer=new ResizeObserver(()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;resizeFrame(frame)})});observer.observe(doc.documentElement);if(doc.body)observer.observe(doc.body);frameObservers.set(frame,observer)}

function observeImages(frame){const doc=frameDocument(frame);if(!doc)return;doc.querySelectorAll("img").forEach(image=>{if(!image.complete)image.addEventListener("load",()=>resizeFrame(frame),{once:true})})}

function observeFonts(frame){const doc=frameDocument(frame);if(!doc?.fonts?.ready)return;doc.fonts.ready.then(()=>resizeFrame(frame)).catch(()=>{})}

function setupFrame(frame){frame.dataset.loaded="true";resizeFrame(frame);setupInternalNavigation(frame);observeFrame(frame);observeImages(frame);observeFonts(frame);requestAnimationFrame(()=>resizeFrame(frame));setTimeout(()=>resizeFrame(frame),120)}

frames.forEach(frame=>frame.addEventListener("load",()=>setupFrame(frame)));

let viewportTimer=null;
window.addEventListener("resize",()=>{clearTimeout(viewportTimer);viewportTimer=setTimeout(()=>frames.forEach(resizeFrame),120)},{passive:true});

window.addEventListener("orientationchange",()=>setTimeout(()=>frames.forEach(resizeFrame),180),{passive:true});

window.addEventListener("load",()=>{frames.forEach(frame=>{if(frame.contentDocument?.readyState==="complete")setupFrame(frame)});if(!location.hash)return;setTimeout(()=>navigateTo(location.hash,false),300)});

window.addEventListener("hashchange",()=>{if(location.hash)navigateTo(location.hash,false)});

const stickyLinks=[...document.querySelectorAll(".site-nav-link")];
const observedSections=[...document.querySelectorAll("main > section[id]")];
const compactContext=document.getElementById("compact-context");
const sectionNames={home:"Home",work:"Work",capabilities:"Capabilities","ai-engineering":"AI Engineering","more-work":"Experience","project-archive":"Project Archive",contact:"Contact"};
const sectionObserver=new IntersectionObserver(entries=>{const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!visible)return;const hash=`#${visible.target.id}`;stickyLinks.forEach(link=>link.classList.toggle("is-active",link.getAttribute("href")===hash));compactContext.textContent=sectionNames[visible.target.id]||"Portfolio";},{rootMargin:"-25% 0px -65% 0px",threshold:[0.05,.2,.5]});
observedSections.forEach(section=>sectionObserver.observe(section));

const siteHeader=document.getElementById("site-header");
const navigation=document.getElementById("portfolio-navigation");
const menuToggle=document.getElementById("menu-toggle");
const floatingNavTrigger=document.getElementById("floating-nav-trigger");
const floatingNavPanel=document.getElementById("floating-nav-panel");
const floatingNavClose=document.getElementById("floating-nav-close");
const languageToggle=document.getElementById("language-toggle");
function applyLanguage(language){localStorage.setItem("portfolio-language",language);document.documentElement.lang=language;languageToggle.textContent=language.toUpperCase();window.portfolioI18n?.apply(language);frames.forEach(frame=>frame.contentWindow?.postMessage({type:"portfolio-language",language},"*"));}
languageToggle?.addEventListener("click",()=>applyLanguage((localStorage.getItem("portfolio-language")||"en")==="en"?"id":"en"));
document.querySelectorAll(".language-choice").forEach(button=>button.addEventListener("click",()=>applyLanguage(button.dataset.language)));
applyLanguage(localStorage.getItem("portfolio-language")||"en");
let lastScrollY=window.scrollY,collapseTimer=null;

function isMenuOpen(){return navigation.classList.contains("menu-open")}
function setCompact(compact){if(isMenuOpen())return;siteHeader.classList.toggle("is-compact",compact)}
function scheduleCompact(){clearTimeout(collapseTimer);collapseTimer=setTimeout(()=>{if(window.scrollY>108&&!isMenuOpen()&&!siteHeader.contains(document.activeElement))setCompact(true)},180)}

function updateStickyUI(){document.body.classList.toggle("nav-scrolled",window.scrollY>=108&&!isMenuOpen())}
window.addEventListener("scroll",()=>{const currentY=window.scrollY;const delta=currentY-lastScrollY;if(currentY<108){setCompact(false)}else if(delta>12){setCompact(true)}lastScrollY=currentY;updateStickyUI()},{passive:true});

siteHeader.addEventListener("focusin",()=>{clearTimeout(collapseTimer);setCompact(false)});
siteHeader.addEventListener("focusout",()=>requestAnimationFrame(()=>{if(!siteHeader.contains(document.activeElement))scheduleCompact()}));

function setMenuOpen(open){navigation.classList.toggle("menu-open",open);navigation.classList.toggle("hidden",!open);siteHeader.classList.toggle("is-menu-open",open);menuToggle?.setAttribute("aria-expanded",open.toString());menuToggle?.setAttribute("aria-label",open?"Close navigation menu":"Open navigation menu");menuToggle?.querySelector(".menu-icon")?.classList.toggle("hidden",open);menuToggle?.querySelector(".close-icon")?.classList.toggle("hidden",!open);if(open)setCompact(false);else if(window.scrollY>=108)setCompact(true);updateStickyUI()}
menuToggle?.addEventListener("click",()=>setMenuOpen(!isMenuOpen()));
function setFloatingPanel(open){floatingNavPanel?.classList.toggle("is-open",open);floatingNavPanel?.setAttribute("aria-hidden",(!open).toString());floatingNavTrigger?.classList.toggle("hidden",open)}
floatingNavTrigger?.addEventListener("click",()=>setFloatingPanel(true));
floatingNavClose?.addEventListener("click",()=>setFloatingPanel(false));
floatingNavPanel?.querySelectorAll("a").forEach(link=>link.addEventListener("click",()=>setFloatingPanel(false)));

document.querySelectorAll("#portfolio-navigation a[href^='#']").forEach(link=>link.addEventListener("click",()=>setCompact(false)));

if(window.scrollY>=108)setCompact(true);
updateStickyUI();

const splash=document.getElementById("splash");
setTimeout(()=>{splash.classList.add("is-hidden");setTimeout(()=>splash.remove(),400)},3000);
</script>
