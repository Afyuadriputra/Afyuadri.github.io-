<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loading...</title>

<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;align-items:center;justify-content:center;background:#0b0d0f;font-family:monospace}

.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0d0f}

.ai-matrix-loader{width:120px;height:160px;position:relative;perspective:800px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}

.digit{color:#00ff88;font-family:monospace;font-size:18px;text-align:center;text-shadow:0 0 5px #00ff88;animation:matrix-fall 2s infinite,matrix-flicker .5s infinite;opacity:0}

.digit:nth-child(1){animation-delay:.1s}.digit:nth-child(2){animation-delay:.3s}.digit:nth-child(3){animation-delay:.5s}.digit:nth-child(4){animation-delay:.7s}.digit:nth-child(5){animation-delay:.9s}.digit:nth-child(6){animation-delay:1.1s}.digit:nth-child(7){animation-delay:1.3s}.digit:nth-child(8){animation-delay:1.5s}

.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(0,255,136,.1) 0%,transparent 70%);animation:matrix-pulse 2s infinite}

.loading-text{margin-top:10px;color:#00ff88;font-size:11px;letter-spacing:.25em;text-transform:uppercase;text-shadow:0 0 8px rgba(0,255,136,.55);animation:text-pulse 1.5s infinite}

@keyframes matrix-fall{0%{transform:translateY(-50px) rotateX(90deg);opacity:0}20%,80%{transform:translateY(0) rotateX(0deg);opacity:.8}100%{transform:translateY(50px) rotateX(-90deg);opacity:0}}

@keyframes matrix-flicker{0%,19%,21%,100%{opacity:.8}20%{opacity:.2}}

@keyframes matrix-pulse{0%,100%{opacity:.3}50%{opacity:.7}}

@keyframes text-pulse{0%,100%{opacity:.4}50%{opacity:1}}

@media(prefers-reduced-motion:reduce){.digit,.glow,.loading-text{animation:none}.digit{opacity:.8}}
</style>
</head>

<body>

<div class="loading-screen">

<div class="ai-matrix-loader" aria-label="Loading">
<div class="digit">0</div>
<div class="digit">1</div>
<div class="digit">0</div>
<div class="digit">1</div>
<div class="digit">1</div>
<div class="digit">0</div>
<div class="digit">0</div>
<div class="digit">1</div>
<div class="glow"></div>
</div>

<div class="loading-text">Loading...</div>

</div>

</body>
</html>
